name: Keep Repo Active

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update timestamp
        run: echo "Last run $(date -u)" > ping-log.txt

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ping-log.txt
          git diff --staged --quiet || git commit -m "chore: keep-alive $(date -u +%Y-%m-%d)"
          git push
